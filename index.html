<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>
      Jordan Morris | Software & Data Engineer | 9+ Years of Experience
    </title>
    <meta name="title" content="Jordan Morris | Software & Data Engineer" />
    <meta
      name="description"
      content="Jordan Morris is a Senior Software & Data Engineer with 9+ years of experience building high‑impact systems for startups, government, and financial services. Specialized in automation, full‑stack development, and cloud architecture."
    />
    <meta
      name="keywords"
      content="Software Engineer, Data Engineer, Full-Stack Developer, React, Python, Automation, AWS, CGI, Capital One, Duke University, Portfolio"
    />
    <meta name="author" content="Jordan Morris" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Canonical URL (replace with your actual domain) -->
    <link rel="canonical" href="https://jordanmorris.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jordanmorris.dev/" />
    <meta
      property="og:title"
      content="Jordan Morris – Software & Data Engineer"
    />
    <meta
      property="og:description"
      content="9+ years of experience building systems that save time and drive real outcomes. Explore portfolio, experience, and client testimonials."
    />
    <meta property="og:image" content="https://jordanmorris.dev/og-image.jpg" />
    <!-- Create a 1200x630 PNG/JPEG -->
    <meta
      property="og:image:alt"
      content="Jordan Morris – Software Engineer portfolio preview"
    />
    <meta property="og:site_name" content="Jordan Morris" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jordanmorris.dev/" />
    <meta
      name="twitter:title"
      content="Jordan Morris – Software & Data Engineer"
    />
    <meta
      name="twitter:description"
      content="Building reliable, high‑performance software for startups and enterprises. See projects and client feedback."
    />
    <meta
      name="twitter:image"
      content="https://jordanmorris.dev/og-image.jpg"
    />
    <meta name="twitter:site" content="@jordanmorris" />
    <!-- optional, if you have a handle -->

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) – Person / Portfolio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jordan Morris",
        "alternateName": "Jordan Morris",
        "jobTitle": "Senior Software & Data Engineer",
        "url": "https://jordanmorris.dev/",
        "sameAs": [
          "https://github.com/jordanmorris",
          "https://www.linkedin.com/in/jordan-morris-6a0869408/",
          "mailto:jordan.morris@example.com"
        ],
        "worksFor": {
          "@type": "Organization",
          "name": "Self-Employed / Freelance"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "Duke University",
            "sameAs": "https://www.duke.edu/"
          },
          {
            "@type": "CollegeOrUniversity",
            "name": "University of Virginia"
          }
        ],
        "knowsAbout": [
          "Software Engineering",
          "Data Engineering",
          "Cloud Architecture",
          "Full-Stack Development",
          "Automation",
          "Python",
          "React",
          "AWS"
        ],
        "description": "Software engineer with 9+ years of experience across finance, government, and independent consulting. I build systems that are reliable, maintainable, and actually get used.",
        "image": "https://jordanmorris.dev/image.png"
      }
    </script>

    <!-- Additional JSON-LD for Portfolio (optional) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Featured Projects",
        "description": "Selected software projects built by Jordan Morris",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "url": "https://jordanmorris.dev/#projects",
            "name": "Workflow Automation Platform"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "url": "https://jordanmorris.dev/#projects",
            "name": "Real-Time Analytics Dashboard"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "url": "https://jordanmorris.dev/#projects",
            "name": "Customer Onboarding Portal"
          }
        ]
      }
    </script>

    <!-- Fallback for older browsers -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
